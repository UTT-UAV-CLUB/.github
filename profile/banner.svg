<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="UTT UAV CLUB" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040A18"/>
      <stop offset="55%" stop-color="#0A1E3C"/>
      <stop offset="100%" stop-color="#062A45"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.80" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.06" cy="0.95" r="0.5">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#22D3EE" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <clipPath id="round">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- quadcopter, top view -->
    <g transform="translate(975 152)" fill="none" stroke="#22D3EE" stroke-linecap="round">
      <g stroke-opacity="0.45" stroke-width="2.5">
        <line x1="-74" y1="-74" x2="74" y2="74"/>
        <line x1="74" y1="-74" x2="-74" y2="74"/>
      </g>
      <g stroke-opacity="0.30" stroke-width="2">
        <circle cx="-82" cy="-82" r="36"/>
        <circle cx="82" cy="-82" r="36"/>
        <circle cx="-82" cy="82" r="36"/>
        <circle cx="82" cy="82" r="36"/>
      </g>
      <g stroke-opacity="0.16" stroke-width="1.5">
        <circle cx="-82" cy="-82" r="50"/>
        <circle cx="82" cy="-82" r="50"/>
        <circle cx="-82" cy="82" r="50"/>
        <circle cx="82" cy="82" r="50"/>
      </g>
      <rect x="-30" y="-30" width="60" height="60" rx="12" stroke="#0EA5E9" stroke-opacity="0.6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#22D3EE" stroke="none" fill-opacity="0.85"/>
    </g>

    <!-- text block -->
    <text x="80" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#7DD3FC" fill-opacity="0.85">TRUONG DAI HOC CONG NGHE GIAO THONG VAN TAI</text>

    <text x="78" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="5" fill="#FFFFFF">UTT UAV CLUB</text>

    <rect x="80" y="196" width="140" height="4" rx="2" fill="url(#accent)"/>

    <text x="80" y="238" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#22D3EE">Câu lạc bộ nghiên cứu Máy bay không người lái</text>

    <text x="80" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2.5" fill="#94A3B8">HA NOI &#183; VIET NAM</text>

    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>
